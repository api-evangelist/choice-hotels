    note: 'X-Mashery-Error-Code: ERR_596_SERVICE_NOT_FOUND, Server: Mashery Proxy.
      Live Mashery gateway, no publicly mapped service. DNS 54.226.35.207 (AWS).'
  - url: https://api.choicehotels.com/v1
