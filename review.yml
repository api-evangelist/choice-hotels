      http://developer.choicehotels.com:80/robots.txt statuscode 401 — the developer
      hostname has existed since at least March 2012 and was already returning 401
      on robots.txt, i.e. credential-gated for over a decade.'
  - url: https://data.sec.gov/submissions/CIK0001046311.json
    status: 200
    note: CHOICE HOTELS INTERNATIONAL INC /DE, ticker CHH, SIC "Hotels & Motels".
      Latest Form 10-K filed 2026-02-19, accession 0001046311-26-000008.
  - url: https://www.sec.gov/Archives/edgar/data/1046311/000104631126000008/chh-20251231.htm
    status: 200
    note: FY2025 Form 10-K, 2,695,323 bytes. Primary source for every quoted
      statement in this file.
